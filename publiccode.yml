publiccodeYmlVersion: "0.5"

name: OAS Generator
url: "https://github.com/developer-overheid-nl/oas-generator"
landingURL: "https://developer-overheid-nl.github.io/oas-generator/"
softwareType: standalone/web

platforms:
  - web

developmentStatus: beta

categories:
  - it-development

dependsOn:
  open:
    - name: spectral
      optional: false
      versionMin: "1.20.0"

description:
  nl:
    shortDescription: >-
      Deze generator kan worden gebruikt om een OpenAPI-specificatie te
      maken dat voldoet aan de NL API Design Rules.

    longDescription: |
      De OAS Generator is een webapplicatie waarmee ontwikkelaars eenvoudig
      een OpenAPI Specification (OAS) document kunnen genereren dat voldoet
      aan de Nederlandse API Design Rules. Op basis van minimale
      configuratie-invoer genereert de tool een volledige OAS-boilerplate
      die direct als startpunt kan dienen voor het ontwikkelen van API's
      voor de Nederlandse overheid.

    features:
      - Genereer een OAS-boilerplate op basis van minimale configuratie
      - Validatie tegen de NL API Design Rules via Spectral

